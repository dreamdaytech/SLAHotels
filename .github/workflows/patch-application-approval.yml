name: Patch application approval flow

on:
  push:
    branches:
      - fix/application-approval-flow

permissions:
  contents: write

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/application-approval-flow
      - name: Fix nested confirmation sequencing
        shell: python
        run: |
          from pathlib import Path

          path = Path('pages/Dashboard.tsx')
          text = path.read_text()
          old = "onClick={() => { onConfirm(); onClose(); }}"
          new = "onClick={() => { onClose(); onConfirm(); }}"
          count = text.count(old)
          if count != 1:
              raise SystemExit(f'Expected exactly one generic ConfirmationModal confirm handler, found {count}')
          path.write_text(text.replace(old, new, 1))
      - name: Commit approval fix
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add pages/Dashboard.tsx
          git commit -m "Fix nested application approval confirmation"
          git push origin HEAD:fix/application-approval-flow
